fragment HomeParts on Home {
  __typename
  hero {
    __typename
    logo
    title
    subtitle
    taglines {
      __typename
      text
    }
    scripture
    scriptureRef
    ctas {
      __typename
      label
      href
      primary
    }
  }
  nav {
    __typename
    links {
      __typename
      label
      href
    }
  }
  sections {
    __typename
    ... on HomeSectionsListSection {
      heading
      intro
      introEmphasis
      groups {
        __typename
        lead
        items {
          __typename
          text
        }
      }
      closing
      closingEmphasis
      scripture
      scriptureRef
      background
      cta {
        __typename
        label
        href
      }
    }
  }
}

fragment PageParts on Page {
  __typename
  title
  intro {
    __typename
    src
    poster
  }
  sections {
    __typename
    ... on PageSectionsListSection {
      heading
      intro
      introEmphasis
      groups {
        __typename
        lead
        items {
          __typename
          text
        }
      }
      closing
      closingEmphasis
      scripture
      scriptureRef
      background
      cta {
        __typename
        label
        href
      }
    }
    ... on PageSectionsFrameworkSection {
      heading
      intro
      introEmphasis
      items {
        __typename
        marker
        title
        description
        points
        scriptureRef
      }
      closing
      closingEmphasis
      background
      animate
    }
    ... on PageSectionsBenefitsSection {
      heading
      benefits
      scripture
      scriptureRef
      background
      animate
    }
    ... on PageSectionsPathsSection {
      heading
      tiers {
        __typename
        badge
        name
        subtitle
        popular
      }
      cta {
        __typename
        label
        href
      }
      background
      animate
    }
  }
}
